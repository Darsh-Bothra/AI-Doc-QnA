[project]
name = "ai-doc-qa"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Darsh-Bothra", email = "darshbothra007@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "aiofiles>=25.1.0",
    "alembic>=1.19.1",
    "dotenv>=0.9.9",
    "email-validator>=2.3.0",
    "fastapi>=0.141.1",
    "openai>=3.3.0",
    "psycopg[binary]>=3.3.4",
    "pwdlib[argon2]>=0.3.1",
    "pydantic-settings>=2.15.0",
    "pyjwt[crypto]>=2.13.0",
    "pymupdf>=1.28.2",
    "pymupdf4llm>=1.28.2",
    "python-multipart>=0.0.32",
    "qdrant-client>=1.19.0",
    "sqlalchemy>=2.0.52",
    "uvicorn>=0.52.2",
]

[project.scripts]
ai-doc-qa = "ai_doc_qa:main"

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.5",
    "testcontainers[postgres,qdrant]>=4.10.0",
]

[tool.ruff]
src = ["src"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "Depends", "Query"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
markers = [
    "integration: needs Docker (Postgres + Qdrant via testcontainers)",
]
filterwarnings = [
    "ignore:Qdrant client version:UserWarning:qdrant_client",
]

[tool.mypy]
# Enable the native Pydantic plugin for accurate schema checking
plugins = ["pydantic.mypy"]

# Start with a clean baseline (feel free to turn on strict mode later)
warn_return_any = true
warn_unused_configs = true

# Stops mypy from throwing errors when third-party libraries lack type hints
ignore_missing_imports = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

